<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <h2>Movie Playlist</h2>
    <script>
        let movies= ["Avengers", "Inception"];
        document.write("Original movies: " +movies + "<br>");

        movies.push("Titanic");
        document.write("After adding movies: " +movies + "<br>");

        movies.pop();
        document.write("After Removing movies: " +movies + "<br>");

        document.write("Total movies: " +movies.length);
    </script>
</body>
</html>
