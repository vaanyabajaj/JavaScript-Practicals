<!DOCTYPE html>

    <title>Trim Function</title>
</head>

<body>

<h2>trim() Function</h2>

<script>

let text = "         Reshal Age         ";

let result = text.trim();

document.write("Original: [" + text + "]<br><br>");

document.write("After Trim: [" + result + "]");

</script>

</body>
