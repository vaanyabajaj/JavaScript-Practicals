<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Checkout Cart</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap');

        /* HIGH-END BOUTIQUE AESTHETIC */
        body {
            font-family: 'Jost', sans-serif;
            background-color: #fcfbf9; /* Warm off-white */
            color: #2c2a29;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .checkout-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }
        }

        h2 {
            font-size: 1.8em;
            font-weight: 500;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        /* Cart Items Section */
        .cart-section {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border: 1px solid #f0ede6;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f0ede6;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-details h4 {
            margin: 0 0 5px 0;
            font-size: 1.1em;
            font-weight: 500;
        }

        .item-details p {
            margin: 0;
            font-size: 0.85em;
            color: #7a7571;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .item-price {
            font-size: 1.1em;
            font-weight: 600;
        }

        /* Order Summary Section */
        .summary-section {
            background: #faf8f5;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #f0ede6;
            height: fit-content;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 1.05em;
        }

        .summary-divider {
            border-top: 1px solid #e6e2db;
            margin: 20px 0;
        }

        .total-row {
            font-size: 1.4em;
            font-weight: 600;
        }

        /* Discount Input */
        .promo-box {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #dcd7d1;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9em;
            outline: none;
            background: #ffffff;
            text-transform: uppercase;
        }

        input[type="text"]:focus {
            border-color: #2c2a29;
        }

        button {
            padding: 12px 20px;
            background-color: #2c2a29;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9em;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #4a4745;
        }

        .btn-checkout {
            width: 100%;
            padding: 16px;
            font-size: 1.1em;
            margin-top: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .discount-tag {
            color: #2e7d32;
            font-weight: 500;
            display: none;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="checkout-container">
        <!-- Left: Cart Items -->
        <div class="cart-section">
            <h2>Shopping Bag</h2>
            <div id="cartContainer">
                <!-- Items will be injected here via JavaScript -->
            </div>
        </div>

        <!-- Right: Order Summary -->
        <div class="summary-section">
            <h2>Order Summary</h2>
            
            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotalDisplay">₹0.00</span>
            </div>
            
            <div class="summary-row discount-tag" id="discountRow">
                <span>Promo Discount</span>
                <span id="discountDisplay">-₹0.00</span>
            </div>

            <div class="summary-row" style="color: #7a7571; font-size: 0.9em;">
                <span>Shipping</span>
                <span>Calculated at next step</span>
            </div>

            <div class="summary-divider"></div>

            <div class="summary-row total-row">
                <span>Total</span>
                <span id="totalDisplay">₹0.00</span>
            </div>

            <div class="promo-box">
                <input type="text" id="promoCode" placeholder="Enter Promo Code">
                <button onclick="applyDiscount()">Apply</button>
            </div>
            <p style="font-size: 0.75em; color: #7a7571; margin-top: -15px;">Try code: <strong>GLOW20</strong></p>

            <button class="btn-checkout">Proceed to Checkout</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. ARRAY OF OBJECTS (Data Handling)
        // ==========================================
        const cartItems = [
            { id: 1, name: "Lavender Soy Wax Candle", category: "Candles", price: 650, qty: 2 },
            { id: 2, name: "Vanilla Bean Minimalist Jar", category: "Candles", price: 800, qty: 1 },
            { id: 3, name: "Matte Black Wick Trimmer", category: "Accessories", price: 450, qty: 1 }
        ];

        let currentSubtotal = 0;
        let isDiscountApplied = false;

        // ==========================================
        // 2. ARRAY METHODS (`forEach`, `reduce`, `filter`)
        // ==========================================
        
        function renderCart() {
            const container = document.getElementById('cartContainer');
            container.innerHTML = ''; // Clear container

            // Concept: .forEach() method to iterate and manipulate DOM
            cartItems.forEach(item => {
                const itemHTML = `
                    <div class="cart-item">
                        <div class="item-details">
                            <h4>${item.name}</h4>
                            <p>${item.category} • Qty: ${item.qty}</p>
                        </div>
                        <div class="item-price">₹${(item.price * item.qty).toFixed(2)}</div>
                    </div>
                `;
                container.innerHTML += itemHTML;
            });

            // Concept: .reduce() method to calculate the subtotal of the cart
            currentSubtotal = cartItems.reduce((acc, item) => acc + (item.price * item.qty), 0);
            
            // Concept: .filter() method (Demonstrating filtering for a specific category)
            const candleItems = cartItems.filter(item => item.category === "Candles");
            console.log("Filtered Candle Items:", candleItems);

            updateTotals(currentSubtotal, 0);
        }

        // ==========================================
        // 3. DISCOUNT LOGIC & UI UPDATE
        // ==========================================
        function applyDiscount() {
            const promoInput = document.getElementById('promoCode').value.trim().toUpperCase();
            const discountRow = document.getElementById('discountRow');
            let discountAmount = 0;

            if (isDiscountApplied) {
                alert("A promo code is already applied to this order.");
                return;
            }

            // Logic checking
            if (promoInput === "GLOW20") {
                // 20% Discount Logic
                discountAmount = currentSubtotal * 0.20;
                isDiscountApplied = true;
                
                // Update UI
                discountRow.style.display = 'flex';
                document.getElementById('discountDisplay').innerText = `-₹${discountAmount.toFixed(2)}`;
                
                alert("Success! 20% discount applied to your order.");
            } else if (promoInput !== "") {
                alert("Invalid Promo Code. Please try again.");
            }

            updateTotals(currentSubtotal, discountAmount);
        }

        function updateTotals(subtotal, discount) {
            const finalTotal = subtotal - discount;
            
            document.getElementById('subtotalDisplay').innerText = `₹${subtotal.toFixed(2)}`;
            document.getElementById('totalDisplay').innerText = `₹${finalTotal.toFixed(2)}`;
        }

        // Initialize cart on page load
        renderCart();
    </script>
</body>
</html>
