<!DOCTYPE html>
<html>

<head>
    <title>Match Function</title>
</head>

<body>

<h2>match() Function</h2>

<script>

let text = "I am learning JavaScript";

let result = text.match("JavaScript");

document.write("Text: " + text + "<br><br>");

document.write("Match Result: " + result);

</script>

</body>

</html>
