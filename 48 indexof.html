<!DOCTYPE html>

<head>
    <title>Index Of Function</title>
</head>

<body>

<h2>indexOf() Function</h2>

<script>

let text = "JavaScript";

let result = text.indexOf("S");

document.write("Text: " + text + "<br><br>");

document.write("Position of S: " + result);

</script>

</body>
