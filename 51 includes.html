<!DOCTYPE html>
<html>

<head>
    <title>Includes Function</title>
</head>

<body>

<h2>includes() Function</h2>

<script>

let text = "I am learning JavaScript";

let result = text.includes("JavaScript");

document.write("Text: " + text + "<br><br>");

document.write("Contains JavaScript: " + result);

</script>

</body>

</html>
