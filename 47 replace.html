<!DOCTYPE html>
<html>

<head>
    <title>Replace Function</title>
</head>

<body>

<h2>replace() Function</h2>

<script>

let text = "I like Java";

let result = text.replace("Java","JavaScript");

document.write("Original Text: " + text + "<br><br>");

document.write("After Replace: " + result);

</script>

</body>

</html>
