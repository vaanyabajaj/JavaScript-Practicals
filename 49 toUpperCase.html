<!DOCTYPE html>
<html>

<head>
    <title>Uppercase Function</title>
</head>

<body>

<h2>toUpperCase() Function</h2>

<script>

let text = "reshal age";

let result = text.toUpperCase();

document.write("Original: " + text + "<br><br>");

document.write("Uppercase: " + result);

</script>

</body>

</html>
