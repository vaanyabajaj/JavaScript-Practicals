<!DOCTYPE html>
<html>

<head>
    <title>Lowercase Function</title>
</head>

<body>

<h2>toLowerCase() Function</h2>

<script>

let text = "RESHAL AGE";

let result = text.toLowerCase();

document.write("Original: " + text + "<br><br>");

document.write("Lowercase: " + result);

</script>

</body>

</html>
